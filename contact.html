        <h1 style="text-align: center;">Scrie-ne un mesaj</h1>

            <input type="text" name="name" placeholder="Numele tău" required style="width: 100%; padding: 12px; margin-bottom: 15px;">

            <textarea name="message" placeholder="Mesaj" rows="5" required style="width: 100%; padding: 12px; margin-bottom: 15px;"></textarea>
            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Trimite</button>
